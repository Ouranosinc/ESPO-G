#config_QC-E5L

full_region:
  name: QC-E5L
  method: bbox
  lon_bnds: [ -83, -55 ]
  lat_bnds: [ 42, 63 ]

subregions:
  n: 750 # number of loc in one region
  #num_of_regions: 6 # can be calculated if we don't know it

extraction:
    reference:
        search_data_catalogs:
            other_search_criteria:
                source: &ref_source
                  ERA5-Land
            periods: &ref_period
              - '1991'
              - '2020'
        extract_dataset: {}

biasadjust_mbcn:
  train:
    period: *ref_period
  attrs:
    bias_adjust_project: MBCn-E5L

clean_up:
  xscen_clean_up:
    attrs_to_remove:
      lat: original_shape
      lon: original_shape
    add_attrs:
      global:
        Notes: |
          Regridded on the grid of ERA5-Land, then bias-adjusted with MBCn.
          The reference was ERA5-Land over the 1989-2018 period.
      lat:
        standard_name: latitude
        units: degrees_north
        axis: Y
        long_name: latitude
      lon:
        standard_name: longitude
        units: degrees_east
        axis: X
        long_name: longitude

diagnostics:
  properties_and_measures:
    period: *ref_period
  health_checks:
    structure:
      coords:
        - lat
        - lon
        - time
      dims:
        - lat
        - lon
        - time

chunks:
  working:
      lat: 15
      lon: 15
      loc: 10
      time: -1
  final: 
      lat: 30
      lon: 30
      time: 4year