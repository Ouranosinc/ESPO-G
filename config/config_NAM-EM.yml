#config_NAM-EM

full_region:
  name: NAM-EM
  method: bbox
  lon_bnds: [-179.95, -10  ]
  lat_bnds: [ 10, 83.4 ]

subregions:
  n: 7500 # number of loc in one region
  #num_of_regions: 6 # can be calculated if we don't know it

extraction:
    reference:
        search_data_catalogs:
            other_search_criteria:
                source: &ref_source
                  EMDNA
                member: OI
            periods: &ref_period
              - '1989'
              - '2018'

biasadjust_mbcn:
  train:
    period: *ref_period

clean_up:
  xscen_clean_up:
    add_attrs:
      global:
        Notes: |
          Regridded on the grid of EMDNA, then bias-adjusted with MBCn.
          The reference was EMDNA over the 1989-2018 period.

diagnostics:
  properties_and_measures:
    period: *ref_period
  health_checks:
    structure:
      coords:
        - lat
        - lon
        - time
      dims:
        - lat
        - lon
        - time

chunks:
  working:
      lat: 15
      lon: 15
      loc: 10
      time: -1
  final: 
      lat: 30
      lon: 30
      time: 4year