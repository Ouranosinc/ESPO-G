    method: bbox
    lat_bnds:  [ 41.4, 49.4] 
    lon_bnds: [ -92.2, -59.8 ]
  Cree:
    name: Cree
    method: bbox
    lat_bnds: [ 46.9, 53.8 ]
    lon_bnds: [ -115, -97.1 ]
  Ute:
    name: Ute
    method: bbox
    lat_bnds:  [ 35.5, 43]
    lon_bnds: [ -109.6, -95.5 ]
  Tlicho:
    name: Tlicho
    method: bbox
    lat_bnds:  [ 61.3, 66.75]
