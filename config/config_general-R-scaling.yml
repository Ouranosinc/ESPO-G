diagnostics:
  properties_and_measures:
    change_units_arg:
      tasmax: degC
      tasmin: degC
      pr: mm d-1
      dtr: K
      # hurs: "%"
      # hursTasmax: "%"
    properties: config/properties.yml

health_checks:
  extract:
    structure: &structure
      coords:
        - rlat
        - rlon
        - time
        - lat 
        - lon
      dims:
        - rlat
        - rlon
        - time
    start_date: &start
      "1950-01-01" 
    end_date: &end
      "2100-12-30"
    variables_and_units: &varunits
      tasmax: "K"
      tasmin: "K"
      pr: "kg m-2 s-1"
      dtr: "K"
      # hurs: "%"
      # hursTasmax: "%"
    cfchecks: &cf
      tasmax:
        cfcheck_from_name: {}
      tasmin:
        cfcheck_from_name: {}
      pr:
        cfcheck_from_name: {}
      dtr:
        cfcheck_from_name: {}
      # hurs:
      #   cfcheck_from_name: {}
    freq: &freq
      D
    # missing: &missing# FIXME: add when xscen>=0.13.2
    #   some_but_not_all:
    #     freq: D
    flags: &flags
      tasmax:
        temperature_extremely_high:
          thresh: '60 degC'
        tasmax_below_tasmin:
      tasmin:
        temperature_extremely_low:
          thresh: '-70 degC'
      pr:
        negative_accumulation_values:
        very_large_precipitation_events:
          thresh: '1650 mm/d'
      dtr:
        negative_accumulation_values:
      # hurs:
      #   percentage_values_outside_of_bounds:
      # hursTasmax:
      #   percentage_values_outside_of_bounds:
    return_flags: True
    raise_on:
      - structure
      - start_date
      - end_date
      - variables_and_units
      - cfchecks
      - freq
      # dont raise on missing here 
  final:
    #structure is in config_region
    start_date: *start
    end_date: *end
    variables_and_units: *varunits
    cfchecks: *cfchecks
    freq: *freq
    # missing: *missing
    flags: *flags
    return_flags: True
    raise_on:
      - structure
      - start_date
      - end_date
      - variables_and_units
      - cfchecks
      - freq
      #- missing

io:
  rechunk:
    worker_mem: 2GB
  save_to_zarr:
    mode: o


logging:
    formatters:
        default:
            format: '%(asctime)s %(levelname)-8s %(name)-15s %(message)s'
            datefmt: '%Y-%m-%d %H:%M:%S'
    handlers:
        console:
            class : logging.StreamHandler
            formatter: default
            level : DEBUG
            stream: ext://sys.stdout #needed to have the right color in pycharm
    loggers:
        xscen:
            level: DEBUG
            handlers: [console]

dask:
    array.slicing.split_large_chunks: False

tdd:
  xarray_open_kwargs:
    decode_timedelta: False


chunks:
  pre-regrid:
    time: 365
    rlat: -1 # dims of input
    rlon: -1