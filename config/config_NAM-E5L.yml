#Configuration file E5L

custom:
    regions:
        southE5L:
            name: southE5L
            method: bbox
            lon_bnds: [ -179.95, -10 ]
            lat_bnds: [ 10, 40.05 ] # bound must land between 2 points
        middleE5L:
            name: middleE5L
            method: bbox
            lon_bnds: [ -179.95, -10 ]
            lat_bnds: [ 40.05, 65.05 ]
        northE5L:
            name: northE5L
            method: bbox
            lon_bnds: [-179.95, -10]
            lat_bnds: [65.05, 83.4]
    full_region:
      name: &nam-name
        NAM-E5L
      method: bbox
      tile_buffer: 1.5
      lon_bnds: [ -179.95, -10 ]
      lat_bnds: [ 10, 83.4 ]


extraction:
    reference:
        search_data_catalogs:
            periods : &ref_period
              - '1991'
              - '2020'
            other_search_criteria:
                source: &ref_source
                    "ERA5-Land"
        extract_dataset: {}

biasadjust:
    variables:
        dtr: &generic-ba
            training_args:
              period: *ref_period
            adjusting_args:
                bias_adjust_reference: 
                  ERA5-Land
        tasmax: *generic-ba
        pr: *generic-ba
        hurs: *generic-ba
        hursTasmax: *generic-ba



clean_up:
  xscen_clean_up:
      maybe_unstack_dict:
        rechunk:
          lat: 20
          lon: 20
          time: -1
      attrs_to_remove:
        lat: original_shape
        lon: original_shape
      add_attrs:
        global:
          Notes: |
            Regridded on the grid of ERA5-Land, then bias-adjusted with detrended
            quantile mapping on a day-of-year basis with a window of 31 days, LOESS
            detrending and 50 quantiles. The reference was ERA5-Land over the
            1991-2020 period. Tasmax, dtr and pr were adjusted, tasmin was computed
            from tasmax and dtr after the adjustment.
          code: https://github.com/Ouranosinc/ESPO-G/tree/snakemake
        lat:
          standard_name: latitude
          units: degrees_north
          axis: Y
          long_name: latitude
        lon:
          standard_name: longitude
          units: degrees_east
          axis: X
          long_name: longitude

diagnostics:
  properties_and_measures:
    period: *ref_period

health_checks:
  final:
    structure:
      coords:
        - lat
        - lon
        - time
      dims:
        - lat
        - lon
        - time
    

chunks:
  working:
    lat: 20
    lon: 20
    loc: 600
    time: -1
  diag:
    lat: -1
    lon: -1
  final: 
    lat: 50
    lon: 50
    time: 4year