#config_NAM-R2

full_region:
  name: NAM-R2
  method: bbox
  lon_bnds: [-179.95, -10  ]
  lat_bnds: [ 10, 83.4 ]

subregions:
  n: 7500 # number of loc in one region
  #num_of_regions: 75 # can be calculated if we don't know it #TODO: still valid with mask ?

extraction:
    reference:
        search_data_catalogs:
            variables_and_freqs: &var_and_freq
                #mask: fx #TODO: add mask
            other_search_criteria:
                source: &ref_source
                  RDRS
            periods : &ref_period
                  - '1989'
                  - '2018'
        extract_dataset:
             #mask: True #TODO: when we have mask


biasadjust_mbcn:
  train:
    period: *ref_period
  attrs:
    bias_adjust_project: MBCn-R2

clean_up:
  xscen_clean_up:
    attrs_to_remove:
      rlat: original_shape
      rlon: original_shape
    add_attrs:
      global:
        Notes: |
          Regridded on the grid of RDRS, then bias-adjusted with MBCn.
          The reference was RDRS over the 1989-2018 period.
      rlat:
        axis: Y
      rlon:
        axis: X
 
diagnostics:
  properties_and_measures:
    period: *ref_period
  health_checks:
    structure:
      coords:
        - lat
        - lon
        - rlat
        - rlon
        - rotated_pole
        - time
      dims:
        - rlat
        - rlon
        - time
  

chunks:
  working:
    rlat: 15
    rlon: 15
    loc: 10
    time: -1
  diag:
    rlat: -1
    rlon: -1
  final: 
    rlat: 30
    rlon: 30
    time: 4year