#config_QC-R2

full_region:
  name: QC-R2
  method: bbox
  lon_bnds: [ -83, -55 ]
  lat_bnds: [ 42, 63 ]

subregions:
  n: 750 # number of loc in one region
  #num_of_regions: 6 # can be calculated if we don't know it

extraction:
    reference:
        search_data_catalogs:
            other_search_criteria:
                source: &ref_source
                  RDRS
            periods: &ref_period
              - '1989'
              - '2018'
        extract_dataset: {}

biasadjust_mbcn:
  train:
    period: *ref_period
  attrs:
    bias_adjust_project: MBCn-R2

clean_up:
  xscen_clean_up:
    attrs_to_remove:
      lat: original_shape
      lon: original_shape
    add_attrs:
      global:
        Notes: |
          Regridded on the grid of RDRS, then bias-adjusted with MBCn.
          The reference was RDRS over the 1989-2018 period.
      lat:
        standard_name: latitude
        units: degrees_north
        axis: Y
        long_name: latitude
      lon:
        standard_name: longitude
        units: degrees_east
        axis: X
        long_name: longitude

diagnostics:
  properties_and_measures:
    period: *ref_period
  health_checks:
    structure:
      coords:
        - lat
        - lon
        - rlat
        - rlon
        - rotated_pole
        - time
      dims:
        - rlat
        - rlon
        - time

chunks:
  working:
      rlat: 15
      rlon: 15
      loc: 10
      time: -1
  final: 
      rlat: 30
      rlon: 30
      time: 4year