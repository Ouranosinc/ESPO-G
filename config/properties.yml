realm: generic
# variables:
#   hursTasmax:
#     standard_name: relative_humidity
#     description: Relative humidity at maximal daily temperature
#     canonical_units: "%"
indicators:
  mean_tasmax:
    base: xsdba.properties.mean
    cf_attrs:
      long_name: mean maximum temperature
      standard_name: air_temperature
    input:
      da: tasmax
  mean_tasmin:
    base: xsdba.properties.mean
    cf_attrs:
      long_name: mean minimum temperature
      standard_name: air_temperature
    input:
      da: tasmin
  mean_pr:
    base: xsdba.properties.mean
    cf_attrs:
      long_name: mean precipitation
      standard_name: precipitation_flux
    input:
      da: pr
  q99_tasmax:
    base: xsdba.properties.quantile
    cf_attrs:
      long_name: 99th quantile of maximum temperature
      standard_name: air_temperature
    input:
      da: tasmax
    parameters:
      q: 0.99
  q99_tasmin:
    base: xsdba.properties.quantile
    cf_attrs:
      long_name: 99th quantile of minimum temperature
      standard_name: air_temperature
    input:
      da: tasmin
    parameters:
      q: 0.99
  q01_tasmax:
    base: xsdba.properties.quantile
    cf_attrs:
      long_name: 1st quantile of maximum temperature
      standard_name: air_temperature
    input:
      da: tasmax
    parameters:
      q: 0.01
  q01_tasmin:
    base: xsdba.properties.quantile
    cf_attrs:
      long_name: 1st quantile of minimum temperature
      standard_name: air_temperature
    input:
      da: tasmin
    parameters:
      q: 0.01
  q99_pr:
    base: xsdba.properties.quantile
    cf_attrs:
      long_name: 99th quantile of precipitation
      standard_name: precipitation_flux
    input:
      da: pr
    parameters:
      q: 0.99
  q95_pr:
    base: xsdba.properties.quantile
    cf_attrs:
      long_name: 95th quantile of precipitation
      standard_name: precipitation_flux
    input:
      da: pr
    parameters:
      q: 0.95
  dry_spell_freq:
    base: xsdba.properties.relative_frequency
    cf_attrs:
      long_name: dry spell frequency
      standard_name: precipitation_flux
    input:
      da: pr
    parameters:
      op: "<"
      thresh: "1 mm d-1"
  aca_tasmax:
    base: xsdba.properties.annual_cycle_amplitude
    cf_attrs:
      long_name: Amplitude of the annual cycle of the maximum temperature
      standard_name: air_temperature
    input:
      da: tasmax
  aca_tasmin:
    base: xsdba.properties.annual_cycle_amplitude
    cf_attrs:
      long_name: Amplitude of the annual cycle of the minimum temperature
      standard_name: air_temperature
    input:
      da: tasmin
  aca_pr:
    base: xsdba.properties.relative_annual_cycle_amplitude
    cf_attrs:
      long_name: Relative amplitude of the annual cycle of the precipitation
      standard_name: precipitation_flux
    input:
      da: pr
  corr_tasmax_tasmin:
    base: xsdba.properties.corr_btw_var
    cf_attrs:
      long_name: Correlation between maximum temperature and minimum temperature
    input:
      da1: tasmax
      da2: tasmin
  corr_tasmax_pr:
    base: xsdba.properties.corr_btw_var
    cf_attrs:
      long_name: Correlation between maximum temperature and precipitation
    input:
      da1: tasmax
      da2: pr
  max_dry_spell:
    base: xsdba.properties.spell_length_distribution
    cf_attrs:
      long_name: Maximum length of dry spell
      standard_name: precipitation_flux
    input:
      da: pr
    parameters:
      method: amount
      op: '<'
      thresh: 1 mm d-1
      stat: max
  max_warm_spell:
    base: xsdba.properties.spell_length_distribution
    cf_attrs:
      long_name: Maximum length of warm spell
      standard_name: air_temperature
    input:
      da: tasmax
    parameters:
      method: quantile
      op: '>='
      thresh: 0.9
      stat: max
  wet_wet:
    base: xsdba.properties.transition_probability
    cf_attrs:
      long_name: Transition probability from a wet day to a wet day
      standard_name: precipitation_flux
    input:
      da: pr
    parameters:
      initial_op: '>='
      final_op: '>='
      thresh: '1 mm d-1'
  dry_wet:
    base: xsdba.properties.transition_probability
    cf_attrs:
      long_name: Transition probability from a dry day to a wet day
      standard_name: precipitation_flux
    input:
      da: pr
    parameters:
      initial_op: '<'
      final_op: '>='
      thresh: '1 mm d-1'
  mean_dtr:
    base: xsdba.properties.mean
    cf_attrs:
      long_name: mean diurnal temperature range
      standard_name: air_temperature_range
    input:
      da: dtr
  q01_dtr:
    base: xsdba.properties.quantile
    input:
      da: dtr
    parameters:
      q: 0.01
  q99_dtr:
    base: xsdba.properties.quantile
    input:
      da: dtr
    parameters:
      q: 0.99
