realm: generic
indicators:
  # Maximum Temperature
  mean_tasmax:
    base: xsdba.properties.mean
    cf_attrs:
      long_name: mean maximum temperature
      standard_name: air_temperature
    input:
      da: tasmax
  std_tasmax:
    base: xsdba.properties.std
    cf_attrs:
      long_name: standard deviation of maximum temperature
      standard_name: air_temperature
    input:
      da: tasmax
    measure: xsdba.measures.BIAS
  q01_tasmax:
    base: xsdba.properties.quantile
    cf_attrs:
      long_name: 1st quantile of maximum temperature
      standard_name: air_temperature
    input:
      da: tasmax
    parameters:
      q: 0.01
  q50_tasmax:
    base: xsdba.properties.quantile
    cf_attrs:
      long_name: 50th quantile of maximum temperature
      standard_name: air_temperature
    input:
      da: tasmax
    parameters:
      q: 0.50
  q99_tasmax:
    base: xsdba.properties.quantile
    cf_attrs:
      long_name: 99th quantile of maximum temperature
      standard_name: air_temperature
    input:
      da: tasmax
    parameters:
      q: 0.99
  amplitude_tasmax:
    base: xsdba.properties.annual_cycle_amplitude
    cf_attrs:
      long_name: Amplitude of the annual cycle of the maximum temperature
      standard_name: air_temperature
    input:
      da: tasmax
  phase_tasmax:
    base: xsdba.properties.annual_cycle_phase
    cf_attrs:
      long_name: Phase of the annual cycle of the maximum temperature
      standard_name: air_temperature
    input:
      da: tasmax
  asymmetry_tasmax:
    base: xsdba.properties.annual_cycle_asymmetry
    cf_attrs:
      long_name: Asymmetry of the annual cycle of the maximum temperature
      standard_name: air_temperature
    input:
      da: tasmax
  mean_warm_spell_tasmax:
    base: xsdba.properties.spell_length_distribution
    cf_attrs:
      long_name: Mean length of warm spell
      standard_name: air_temperature
    input:
      da: tasmax
    parameters:
      method: quantile
      op: '>='
      thresh: 0.9
      window: 3
      stat: mean
  autocorrelation_tasmax:
    base: xsdba.properties.acf
    cf_attrs:
      long_name: Autocorrelation function of maximum temperature
      standard_name: air_temperature
    input:
      da: tasmax

  # Minimum Temperature
  mean_tasmin:
    base: xsdba.properties.mean
    cf_attrs:
      long_name: mean minimum temperature
      standard_name: air_temperature
    input:
      da: tasmin
  std_tasmin:
    base: xsdba.properties.std
    cf_attrs:
      long_name: standard deviation of minimum temperature
      standard_name: air_temperature
    input:
      da: tasmin
    measure: xsdba.measures.BIAS
  q01_tasmin:
    base: xsdba.properties.quantile
    cf_attrs:
      long_name: 1st quantile of minimum temperature
      standard_name: air_temperature
    input:
      da: tasmin
    parameters:
      q: 0.01
  q50_tasmin:
    base: xsdba.properties.quantile
    cf_attrs:
      long_name: 50th quantile of minimum temperature
      standard_name: air_temperature
    input:
      da: tasmin
    parameters:
      q: 0.50
  q99_tasmin:
    base: xsdba.properties.quantile
    cf_attrs:
      long_name: 99th quantile of minimum temperature
      standard_name: air_temperature
    input:
      da: tasmin
    parameters:
      q: 0.99
  amplitude_tasmin:
    base: xsdba.properties.annual_cycle_amplitude
    cf_attrs:
      long_name: Amplitude of the annual cycle of the minimum temperature
      standard_name: air_temperature
    input:
      da: tasmin
  phase_tasmin:
    base: xsdba.properties.annual_cycle_phase
    cf_attrs:
      long_name: Phase of the annual cycle of the minimum temperature
      standard_name: air_temperature
    input:
      da: tasmin
  asymmetry_tasmin:
    base: xsdba.properties.annual_cycle_asymmetry
    cf_attrs:
      long_name: Asymmetry of the annual cycle of the minimum temperature
      standard_name: air_temperature
    input:
      da: tasmin
  mean_cold_spell_tasmin:
    base: xsdba.properties.spell_length_distribution
    cf_attrs:
      long_name: Mean length of cold spell
      standard_name: air_temperature
    input:
      da: tasmin
    parameters:
      method: quantile
      op: '<='
      thresh: 0.1
      window: 3
      stat: mean
  autocorrelation_tasmin:
    base: xsdba.properties.acf
    cf_attrs:
      long_name: Autocorrelation function of minimum temperature
      standard_name: air_temperature
    input:
      da: tasmin

  # Diurnal Temperature Range
  mean_dtr:
    base: xsdba.properties.mean
    cf_attrs:
      long_name: mean diurnal temperature range
      standard_name: air_temperature_range
    input:
      da: dtr
  std_dtr:
    base: xsdba.properties.std
    cf_attrs:
      long_name: standard deviation of diurnal temperature range
      standard_name: air_temperature_range
    input:
      da: dtr
    measure: xsdba.measures.BIAS
  q01_dtr:
    base: xsdba.properties.quantile
    input:
      da: dtr
    parameters:
      q: 0.01
  q50_dtr:
    base: xsdba.properties.quantile
    input:
      da: dtr
    parameters:
      q: 0.50 
  q99_dtr:
    base: xsdba.properties.quantile
    input:
      da: dtr
    parameters:
      q: 0.99
  amplitude_dtr:
    base: xsdba.properties.annual_cycle_amplitude
    cf_attrs:
      long_name: Amplitude of the annual cycle of the diurnal temperature range
      standard_name: air_temperature_range
    input:
      da: dtr
  phase_dtr:
    base: xsdba.properties.annual_cycle_phase
    cf_attrs:
      long_name: Phase of the annual cycle of the diurnal temperature range
      standard_name: air_temperature_range
    input:
      da: dtr
  asymmetry_dtr:
    base: xsdba.properties.annual_cycle_asymmetry
    cf_attrs: 
      long_name: Asymmetry of the annual cycle of the diurnal temperature range
      standard_name: air_temperature_range
    input:
      da: dtr
  autocorrelation_dtr:
    base: xsdba.properties.acf
    cf_attrs:
      long_name: Autocorrelation function of diurnal temperature range
      standard_name: air_temperature_range
    input:  
      da: dtr
  # Precipitation
  mean_pr:
    base: xsdba.properties.mean
    cf_attrs:
      long_name: mean precipitation
      standard_name: precipitation_flux
    input:
      da: pr
  std_pr:
    base: xsdba.properties.std
    cf_attrs:
      long_name: standard deviation of precipitation
      standard_name: precipitation_flux
    input:
      da: pr
    measure: xsdba.measures.BIAS
  q50_pr:
    base: xsdba.properties.quantile
    cf_attrs:
      long_name: 50th quantile of precipitation
      standard_name: precipitation_flux
    input:
      da: pr
    parameters:
      q: 0.50
  q95_pr:
    base: xsdba.properties.quantile
    cf_attrs:
      long_name: 95th quantile of precipitation
      standard_name: precipitation_flux
    input:
      da: pr
    parameters:
      q: 0.95
  q99_pr:
    base: xsdba.properties.quantile
    cf_attrs:
      long_name: 50th quantile of precipitation
      standard_name: precipitation_flux
    input:
      da: pr
    parameters:
      q: 0.99
  q995_pr:
    base: xsdba.properties.quantile
    cf_attrs:
      long_name: 99.5th quantile of precipitation
      standard_name: precipitation_flux
    input:
      da: pr
    parameters:
      q: 0.995
  amplitude_pr:
    base: xsdba.properties.annual_cycle_amplitude
    cf_attrs:
      long_name: Amplitude of the annual cycle of the precipitation
      standard_name: precipitation_flux
    input:
      da: pr
  phase_pr:
    base: xsdba.properties.annual_cycle_phase
    cf_attrs:
      long_name: Phase of the annual cycle of the precipitation
      standard_name: precipitation_flux
    input:
      da: pr
  asymmetry_pr:
    base: xsdba.properties.annual_cycle_asymmetry
    cf_attrs:
      long_name: Asymmetry of the annual cycle of the precipitation
      standard_name: precipitation_flux
    input:
      da: pr
  dry_days_freq_pr:
    base: xsdba.properties.relative_frequency
    cf_attrs:
      long_name: dry days frequency
      standard_name: precipitation_flux
    input:
      da: pr
    parameters:
      op: "<"
      thresh: "1 mm d-1"
  mean_dry_spell_pr:
    base: xsdba.properties.spell_length_distribution
    cf_attrs:
      long_name: Mean length of dry spell
      standard_name: precipitation_flux
    input:
      da: pr
    parameters:
      method: amount
      op: '<'
      thresh: 1 mm d-1
      window: 3
      stat: mean
  wet_wet_pr:
    base: xsdba.properties.transition_probability
    cf_attrs:
      long_name: Transition probability from a wet day to a wet day
      standard_name: precipitation_flux
    input:
      da: pr
    parameters:
      initial_op: '>='
      final_op: '>='
      thresh: '1 mm d-1'
  dry_wet_pr:
    base: xsdba.properties.transition_probability
    cf_attrs:
      long_name: Transition probability from a dry day to a wet day
      standard_name: precipitation_flux
    input:
      da: pr
    parameters:
      initial_op: '<'
      final_op: '>='
      thresh: '1 mm d-1'
  autocorrelation_pr:
    base: xsdba.properties.acf
    cf_attrs:
      long_name: Autocorrelation function of precipitation
      standard_name: precipitation_flux
    input:
      da: pr
  # Correlations between variables
  corr_tasmax_tasmin:
    base: xsdba.properties.corr_btw_var
    cf_attrs:
      long_name: Correlation between maximum temperature and minimum temperature
    input:
      da1: tasmax
      da2: tasmin
  corr_tasmax_pr:
    base: xsdba.properties.corr_btw_var
    cf_attrs:
      long_name: Correlation between maximum temperature and precipitation
    input:
      da1: tasmax
      da2: pr