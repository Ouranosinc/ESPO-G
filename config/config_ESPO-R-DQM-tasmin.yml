diagnostics:
  properties_and_measures:
    change_units_arg:
      tasmax: degC
      tasmin: degC
      pr: mm d-1
      dtr: K
      # hurs: "%"
      # hursTasmax: "%"
    properties: config/properties.yml
    period: *ref_period

health_checks:
  extract:
    structure:
      coords:
        - rlat
        - rlon
        - time
        - lat 
        - lon
      dims:
        - rlat
        - rlon
        - time
    start_date: &start
      "1951-01-01" 
    end_date: &end
      "2100-12-30"
    variables_and_units: &varunits
      tasmax: "K"
      tasmin: "K"
      pr: "kg m-2 s-1"
      dtr: "K"
      # hurs: "%"
      # hursTasmax: "%"
    cfchecks: &cf
      tasmax:
        cfcheck_from_name: {}
      tasmin:
        cfcheck_from_name: {}
      pr:
        cfcheck_from_name: {}
      dtr:
        cfcheck_from_name: {}
      # hurs:
      #   cfcheck_from_name: {}
    freq: &freq
      D
    missing: # warn but don't raise
      mising_any:
        freq: YS
    flags: &flags
      tasmax:
        temperature_extremely_high:
          thresh: '60 degC'
        tasmax_below_tasmin:
      tasmin:
        temperature_extremely_low:
          thresh: '-70 degC'
      pr:
        negative_accumulation_values:
        very_large_precipitation_events:
          thresh: '1650 mm/d'
      dtr:
        negative_accumulation_values:
      # hurs:
      #   percentage_values_outside_of_bounds:
      # hursTasmax:
      #   percentage_values_outside_of_bounds:
    return_flags: True
    raise_on:
      - structure
      - start_date
      - end_date
      - variables_and_units
      - cfchecks
      - freq
      # dont raise on missing here 
  final:
    start_date: *start
    end_date: *end
    variables_and_units: *varunits
    cfchecks: *cf
    freq: *freq
    missing:
      missing_some_but_not_all:
        freq: YS
    flags: *flags
    return_flags: True
    raise_on:
      - structure
      - start_date
      - end_date
      - variables_and_units
      - cfchecks
      - freq
      - missing

io:
  rechunk:
    worker_mem: 2GB


logging:
    formatters:
        default:
            format: '%(asctime)s %(levelname)-8s %(name)-15s %(message)s'
            datefmt: '%Y-%m-%d %H:%M:%S'
    handlers:
        console:
            class : logging.StreamHandler
            formatter: default
            level : DEBUG
            stream: ext://sys.stdout #needed to have the right color in pycharm
    loggers:
        xscen:
            level: DEBUG
            handlers: [console]

dask:
    array.slicing.split_large_chunks: False

tdd:
  xarray_open_kwargs:
    decode_timedelta: False


chunks:
  pre-regrid:
    time: 365
    rlat: -1 # dims of input
    rlon: -1
  workingloc:
    loc: 600
    time: -1
  workingXY:
    X: 20
    Y: 20
    time: -1
  diag:
    Y: -1
    X: -1
  final: 
    Y: 50
    X: 50
    time: 4year
