#Configuration file for ESPO-R6-C3 DQM tasmin
subregions:
  n: 50000 # number of loc in each subregions


full_region:
  name: &domain
    NAM
  method: bbox
  tile_buffer: 1.5 #removed in make ref
  lon_bnds: [ -179.95, -10 ]
  lat_bnds: [ 12.5, 83.4 ]

#TODO: change workflow to allow for 2 refs.

extraction:
  reference:
    CaSR:
      search_data_catalogs:
        variables_and_freqs:
          tasmax: D
          tasmin: D
          pr: D
          dtr: D
          mask: fx # for casr
          # hurs: D
          # hursTasmax: D
        allow_resampling: False
        allow_conversion: True
        periods : &ref_period
          - '1991'
          - '2020'
        other_search_criteria: # for casr
          source: "CaSR"
          version: "v32"
      extract_dataset: # for casr
            mask: True
  simulation:
      search_data_catalogs:
        variables_and_freqs:
          tasmax: D
          tasmin: D
          pr: D
          dtr: D
          sftlf: fx
          #hurs: D
          #hursmin: D
        match_hist_and_fut: True
        allow_conversion: True
        allow_resampling: False
        periods: &sim_period
          - '1951' 
          - '2100'
        restrict_members:
          ordered: 1
        other_search_criteria:
          processing_level: raw
          experiment: ssp370
          source: CRCM5-SN
          driving_model: 
            - MPI-ESM1-2-LR
            - CanESM5
            - NorESM2-MM
            #- CNRM-ESM2-1
          #driving_member: r1i1p1f1
          #member: r1
      extract_dataset:
        periods : *sim_period
        xr_combine_kwargs:
          combine_attrs: override
        xr_open_kwargs:
          engine: h5netcdf
          drop_variables:
            - height
            - bnds
            - time_bnds
            - time_bounds
            - lat_bnds
            - lon_bnds
            #- crs
            - quantization_info
      create_mask:
        variable: sftlf
        where_operator: ">="
        where_threshold: 0.25
        mask_nans: True
  clean_up:
    variables_and_units:
      tasmax: K
      tasmin: K
      pr: kg m-2 s-1 # xscen should work if standard_name is 'precipitation_flux'
      dtr: K
      # hurs: "%"
      # hursTasmax: "%"

regrid:
  regrid_dataset:
      regridder_kwargs:
        method: bilinear
        extrap_method: inverse_dist
        locstream_out: True
        reuse_weights: False

biasadjust:
    variables:
        dtr:
            training_args:
                method: DetrendedQuantileMapping
                period: *ref_period
                group: &group
                    group: time.dayofyear
                    window: 31
                jitter_under: # to avoid negative dtr (when temperature inversion GFDL)
                   thresh: 1e-4 K
                xsdba_train_args:
                    kind: "*"
                    nquantiles: 50
            adjusting_args:
                periods: *sim_period
                xsdba_adjust_args: &adj-args
                    detrend:
                        LoessDetrend:
                          f: 0.2
                          niter: 1
                          d: 0
                          weights: tricube
                    interp: nearest
                    extrapolation: constant
                bias_adjust_institution: &b_a_inst
                  Ouranos
                bias_adjust_project: &b_a_pro
                  DQM
        tasmin:
            training_args:
                method: DetrendedQuantileMapping
                period: *ref_period
                group: *group
                xsdba_train_args:
                    kind: "+"
                    nquantiles: 50
            adjusting_args:
                periods: *sim_period
                xsdba_adjust_args: *adj-args
                bias_adjust_institution: *b_a_inst
                bias_adjust_project: *b_a_pro
        tasmax:
            training_args:
                method: DetrendedQuantileMapping
                period: *ref_period
                group: *group
                xsdba_train_args:
                    kind: "+"
                    nquantiles: 50
            adjusting_args:
                periods: *sim_period
                xsdba_adjust_args: *adj-args
                bias_adjust_institution: *b_a_inst
                bias_adjust_project: *b_a_pro
        pr:
            training_args:
                method: DetrendedQuantileMapping
                period: *ref_period
                group: *group
                jitter_under:
                    thresh: 0.01 mm d-1
                xsdba_train_args:
                    kind: "*"
                    nquantiles: 50
                    adapt_freq_thresh: "1.1574e-05 kg m^-2 s^-1" # xsdba cant convert mm/day automatically
            adjusting_args:
                periods: *sim_period
                xsdba_adjust_args: *adj-args
                bias_adjust_institution: *b_a_inst
                bias_adjust_project: *b_a_pro
        # hurs:
        #     training_args:
        #         method: DetrendedQuantileMapping
        #         group: *group
        #         xsdba_train_args:
        #             kind: "*"
        #             nquantiles: 50
        #     adjusting_args:
        #         periods: *sim_period
        #         xsdba_adjust_args: *adj-args
        #         bias_adjust_institution: *b_a_inst
        #         bias_adjust_project: *b_a_pro
        # hursTasmax:
        #     training_args:
        #         method: DetrendedQuantileMapping
        #         group: *group
        #         xsdba_train_args:
        #             kind: "*"
        #             nquantiles: 50
        #     adjusting_args:
        #         periods: *sim_period
        #         xsdba_adjust_args: *adj-args
        #         bias_adjust_institution: *b_a_inst
        #         bias_adjust_project: *b_a_pro

filter_extremes:
  factor: 1000


clean_up:
  save:
    bitround: 12
  xscen_clean_up:
    tasmax:
      maybe_unstack_dict: &maybe
        stack_drop_nans: True
      change_attr_prefix: &prefix
        '' 
      remove_all_attrs_except: 
        global: &gattrs_to_keep
          - history
          - "cat:id"
          - "cat:source"
          - "cat:member"
          - "cat:experiment"
          - "cat:institution"
          - "cat:activity"
          - "cat:bias_adjust_project"
          - "cat:bias_adjust_institution"
          - "cat:bias_adjust_reference"
          - "cat:domain"
          - "cat:mip_era"
          - "cat:type"
          - "cat:driving_model"
          - "cat:driving_member"
        tasmax: &attrs_to_keep
          - bias_adjustment
          - cell_methods
          - coordinates
          - history
          - long_name
          - standard_name
          - units
          - grid_mapping
      add_attrs:
        global: &gattrs_to_add
          dataset: ESPO6
          version: v20
          code: https://github.com/Ouranosinc/ESPO-G/tree/snakemake #TODO: put most up-to-date info
          contact: lavoie.juliette@ouranos.ca
          organisation: Groupe scénarios et services climatiques, Consortium Ouranos, Montréal, QC; www.ouranos.ca
          avertissement : Ouranos ne donne aucune garantie, expresse ou implicite, y compris, mais sans s'y limiter, les garanties de qualité marchande et d'adéquation à un usage particulier. Toutes les responsabilités découlant de la fourniture des informations (y compris toute responsabilité découlant d'une négligence) sont exclues dans toute la mesure permise par la loi.
          organization: Scenarios and Climate Services Group, Ouranos Consortium, Montreal, QC; www.ouranos.ca
          disclaimer: Ouranos make no warranty, either express or implied, including, but not limited to, warranties of merchantability and fitness for a particular purpose. All liabilities arising from the supply of the information (including any liability arising in negligence) are excluded to the fullest extent permitted by law.
          license:  Creative Commons Attribution 4.0 International (https://creativecommons.org/licenses/by/4.0/)
          "cat:domain": *domain
          "cat:_data_format_": "zarr"
          Notes: |
            Regridded on the grid of the reference, then bias-adjusted with detrended
            quantile mapping. The reference period was 1991-2020. Tasmax,
            tasmin, dtr and pr were adjusted.
        tasmax:
            standard_name: air_temperature
            long_name: Maximal daily temperature
            cell_methods: "time: maximum within days"
    pr:
      maybe_unstack_dict: *maybe
      round_var:
        pr: 10
      change_attr_prefix: *prefix
      remove_all_attrs_except: 
        global: *gattrs_to_keep
        pr: *attrs_to_keep
      add_attrs:
        global: *gattrs_to_add
        pr:
            standard_name: precipitation_flux
            long_name: Mean daily precipitation flux
            cell_methods: "time: mean within days"
    dtr:
      maybe_unstack_dict: *maybe
      change_attr_prefix: *prefix
      remove_all_attrs_except: 
        global: *gattrs_to_keep
        dtr: *attrs_to_keep
      add_attrs:
        global: *gattrs_to_add
        dtr:
          cell_methods: "time: range within days"
          description: Diurnal temperature range from tasmax and tasmin.
          standard_name: air_temperature
          long_name: Diurnal temperature range.
    tasmin: # a lot already done in tasmax and dtr
      maybe_unstack_dict: *maybe
      remove_all_attrs_except: 
        tasmin: *attrs_to_keep
      add_attrs:
        tasmin:
            standard_name: air_temperature
            long_name: Minimal daily temperature
            cell_methods: "time: minimum within days"
