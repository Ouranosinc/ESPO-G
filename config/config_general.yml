#Configuration file for ESPO v2.0 project lait-e
extraction:
  reference:
      search_data_catalogs:
        variables_and_freqs:
          tasmax: D
          hurs: D
          hursTasmax: D
        allow_resampling: False
        allow_conversion: True
  simulation:
      search_data_catalogs:
        variables_and_freqs:
          tasmax: D
          hurs: D
          hursmin: D
        match_hist_and_fut: True
        allow_conversion: True
        allow_resampling: False
        periods: &sim_period
          - '1950' 
          - '2100'
        restrict_members:
          ordered: 1
        other_search_criteria:
          processing_level: raw
          mip_era: CMIP6
          source: #TCR likely (v2)
            - ACCESS-CM2
            - ACCESS-ESM1-5 #(not avail at Ouranos), asli got it
            - BCC-CSM2-MR #(not avail)
            - CMCC-ESM2
            - CNRM-CM6-1
            - CNRM-ESM2-1 
            - FGOALS-g3 #(not avail at Ouranos), only ssp126 available
            - GFDL-ESM4 #(not avail at Ouranos), pas de hursmin daily
            - MIROC-ES2L #(not avail at Ouranos), asli got it
            - MIROC6 #(not avail at Ouranos), asli got it
            - MPI-ESM1-2-HR
            - MPI-ESM1-2-LR
            - MRI-ESM2-0
            - NorESM2-LM #(not avail at Ouranos),  pas de hursmin daily
          experiment:
            - ssp245
            - ssp370
        exclusions:
          source: KACE-1-0-G # https://github.com/Ouranosinc/ESPO-G/issues/6
      extract_dataset:
        periods : *sim_period
        xr_combine_kwargs:
          combine_attrs: override
        xr_open_kwargs:
          drop_variables:
            - height
            - bnds
            - time_bnds
            - lat_bnds
            - lon_bnds
  clean_up:
    variables_and_units:
      tasmax: K
      hurs: "%"
      hursTasmax: "%"

regrid:
  regrid_dataset:
      regridder_kwargs:
        method: bilinear
        extrap_method: inverse_dist
        locstream_out: True
        reuse_weights: False
      intermediate_grids:
        reg1:
          cf_grid_2d:
            lon0_b: 179.05
            lon1_b: 351.2
            d_lon: 1
            lat0_b: 9
            lat1_b: 84
            d_lat: 1
          regridder_kwargs:
            method: bilinear
            extrap_method: inverse_dist
            locstream_out: False
            reuse_weights: False
        reg2:
          cf_grid_2d:
            lon0_b: 179.04
            lon1_b: 351.2
            d_lon: 0.5
            lat0_b: 8.9
            lat1_b: 84
            d_lat: 0.5
          regridder_kwargs:
            method: bilinear
            extrap_method: inverse_dist
            locstream_out: False
            reuse_weights: False

biasadjust:
    variables:
        tasmax:
            training_args:
                method: DetrendedQuantileMapping
                group: &group
                    group: time.dayofyear
                    window: 31
                xsdba_train_args:
                    kind: "+"
                    nquantiles: 50
            adjusting_args:
                periods: *sim_period
                xsdba_adjust_args: &adj-args
                    detrend:
                        LoessDetrend:
                          f: 0.2
                          niter: 1
                          d: 0
                          weights: tricube
                    interp: nearest
                    extrapolation: constant
                bias_adjust_institution: &b_a_inst
                  Ouranos
                bias_adjust_project: &b_a_pro
                  ESPO6
        hurs:
            training_args:
                method: DetrendedQuantileMapping
                group: *group
                xsdba_train_args:
                    kind: "*"
                    nquantiles: 50
            adjusting_args:
                periods: *sim_period
                xsdba_adjust_args: *adj-args
                bias_adjust_institution: *b_a_inst
                bias_adjust_project: *b_a_pro
        hursTasmax:
            training_args:
                method: DetrendedQuantileMapping
                group: *group
                xsdba_train_args:
                    kind: "*"
                    nquantiles: 50
            adjusting_args:
                periods: *sim_period
                xsdba_adjust_args: *adj-args
                bias_adjust_institution: *b_a_inst
                bias_adjust_project: *b_a_pro

clean_up:
  save:
    bitround: 12
  xscen_clean_up:
      maybe_unstack_dict:
        stack_drop_nans: True
      # clip_var: #FIXME: add when xscen>=0.13.1
      #   hurs: [0, 100]
      #   hursTasmax: [0, 100]
      change_attr_prefix: ''
      remove_all_attrs_except:
        global:
          - history
          - "cat:id"
          - "cat:source"
          - "cat:member"
          - "cat:experiment"
          - "cat:institution"
          - "cat:activity"
          - "cat:bias_adjust_project"
          - "cat:bias_adjust_institution"
          - "cat:domain"
          - "cat:mip_era"
          - "cat:type"
        tasmax: &attrs_to_keep
          - bias_adjustment
          - cell_methods
          - coordinates
          - history
          - long_name
          - standard_name
          - units
        hurs: *attrs_to_keep
        hursTasmax: *attrs_to_keep
      add_attrs:
        global:
          dataset: ESPO6
          version: v20
          code: https://github.com/Ouranosinc/ESPO-G/tree/lait-e #TODO: put most up-to-date info
          contact: lavoie.juliette@ouranos.ca
          organisation: Groupe scénarios et services climatiques, Consortium Ouranos, Montréal, QC; www.ouranos.ca
          avertissement : Ouranos ne donne aucune garantie, expresse ou implicite, y compris, mais sans s'y limiter, les garanties de qualité marchande et d'adéquation à un usage particulier. Toutes les responsabilités découlant de la fourniture des informations (y compris toute responsabilité découlant d'une négligence) sont exclues dans toute la mesure permise par la loi.
          organization: Scenarios and Climate Services Group, Ouranos Consortium, Montreal, QC; www.ouranos.ca
          disclaimer: Ouranos make no warranty, either express or implied, including, but not limited to, warranties of merchantability and fitness for a particular purpose. All liabilities arising from the supply of the information (including any liability arising in negligence) are excluded to the fullest extent permitted by law.
          license:  Creative Commons Attribution 4.0 International (https://creativecommons.org/licenses/by/4.0/)
        tasmax:
            standard_name: air_temperature
            long_name: Maximal daily temperature
            cell_methods: "time: maximum within days"
        hurs:
            standard_name: relative_humidity
            long_name: Relative humidity
            cell_methods: "time: mean within days"
        hursTasmax:
          standard_name: relative_humidity
          long_name: Relative humidity at maximal daily temperature
          cell_methods: "time: point"
          note: The bias adjustement was computed from hursmin of the simulation and hursTasmax of the reference.


diagregion:
  lait:
    lat_bnds: [44.991361, 55.306617]
    lon_bnds: [ -79.579336, -56.934953]
    method: bbox
    name: lait

diagnostics:
  properties_and_measures:
    change_units_arg:
      tasmax: degC
      hurs: "%"
      hursTasmax: "%"
    properties: config/properties.yml

health_checks:
    start_date: "1950-01-01" 
    end_date: "2100-12-30"
    variables_and_units:
      tasmax: "K"
      hurs: "%"
      hursTasmax: "%"
    cfchecks:
      tasmax:
        cfcheck_from_name: {}
      hurs:
        cfcheck_from_name: {}
    freq: D
    flags:
      tasmax:
        temperature_extremely_high:
          thresh: '60 degC'
      hurs:
        percentage_values_outside_of_bounds:
      hursTasmax:
        percentage_values_outside_of_bounds:
    return_flags: True
    raise_on:
      - structure
      - start_date
      - end_date
      - variables_and_units
      - cfchecks
      - freq

io:
  rechunk:
    worker_mem: 2GB
  save_to_zarr:
    mode: o


logging:
    formatters:
        default:
            format: '%(asctime)s %(levelname)-8s %(name)-15s %(message)s'
            datefmt: '%Y-%m-%d %H:%M:%S'
    handlers:
        console:
            class : logging.StreamHandler
            formatter: default
            level : DEBUG
            stream: ext://sys.stdout #needed to have the right color in pycharm
    loggers:
        xscen:
            level: DEBUG
            handlers: [console]

dask:
    array.slicing.split_large_chunks: False

tdd:
  xarray_open_kwargs:
    decode_timedelta: False


chunks:
  pre-regrid: 
    time: 365
    lat: -1 # always lat,lon
    lon: -1