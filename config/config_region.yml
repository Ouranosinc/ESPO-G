#Configuration file region lait C3

custom:
    regions:
      lait-C3:
        name: lait-C3
        method: bbox
        lat_bnds: [44.991361, 55.306617]
        lon_bnds: [ -79.579336, -56.934953]
    full_region:
      name:
        lait-C3
      method: bbox
      tile_buffer: 1.5
      lat_bnds: [44.991361, 55.306617]
      lon_bnds: [ -79.579336, -56.934953]


extraction:
    reference:
        search_data_catalogs:
            variables_and_freqs: &var_and_freq
                mask: fx
            periods : &ref_period
              - '1991'
              - '2020'            
            other_search_criteria:
                source: &ref_source
                    "CaSR"
                version: "v32"
        extract_dataset:
            mask: True

biasadjust:
    variables:
        tasmax: &generic-ba
            training_args:
                period: *ref_period
            # adjusting_args:
            #     bias_adjust_reference: #FIXME: put when xscen>=0.13.1
            #       CaSRv32 # TODO: put right version
        hurs: *generic-ba
        hursTasmax: *generic-ba

bias_adjust_reference: #in the mean time
  CaSRv32


clean_up:
  xscen_clean_up:
      maybe_unstack_dict:
        rechunk:
          rlat: 20
          rlon: 20
          time: -1
      attrs_to_remove:
        rlat: original_shape
        rlon: original_shape
      add_attrs:
        global:
          Notes: |
            Regridded on the grid of CaSR v3.2, then bias-adjusted with detrended
            quantile mapping on a day-of-year basis with a window of 31 days, LOESS
            detrending and 50 quantiles. The reference was CaSR v3.1 over the
            1991-2020 period. 
        rlat:
          axis: Y
        rlon:
          axis: X

diagnostics:
  properties_and_measures:
    period: *ref_period

health_checks:
    structure:
      coords:
        - rlat
        - rlon
        - time
        - lat 
        - lon
        - rotated_pole
      dims:
        - rlat
        - rlon
        - time
    

chunks:
  working:
    rlat: 20
    rlon: 20
    loc: 600
    time: -1
  diag:
    rlat: -1
    rlon: -1
  final: 
    rlat: 50
    rlon: 50
    time: 4year