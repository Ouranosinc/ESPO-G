#Configuration file NAM-C3

custom:
    regions:
        # southC3:
        #     name: southC3
        #     method: sel
        #     rlon: &rlon
        #       [-35, 28]
        #     rlat: [ -41, -23 ]
        # middleC3:
        #     name: middleC3
        #     method: sel
        #     rlon: *rlon
        #     rlat:  [ -23, 1 ]
        # northC3:
        #     name: northC3
        #     method: sel
        #     rlon: *rlon
        #     rlat: [ 1, 26 ]
        aC3:
            name: aC3
            method: sel
            rlon: &rlon
              [-35, 28]
            rlat: [ -41, -30 ]
        bC3:
            name: bC3
            method: sel
            rlon: *rlon
            rlat:  [ -30, -15 ]
        cC3:
            name: cC3
            method: sel
            rlon: *rlon
            rlat:  [ -15, -5 ]
        dC3:
            name: dC3
            method: sel
            rlon: *rlon
            rlat:  [ -5, 5 ]
        eC3:
          name: eC3
          method: sel
          rlon: *rlon
          rlat:  [ 5, 15 ]
        fC3:
          name: fC3
          method: sel
          rlon: *rlon
          rlat:  [ 15, 26 ]
    full_region:
      name:
        NAM-C3
      method: bbox
      tile_buffer: 1.5
      lon_bnds: [ -179.95, -10 ]
      lat_bnds: [ 10, 83.4 ]


extraction:
    reference:
        search_data_catalogs:
            variables_and_freqs:
                mask: fx
            periods : &ref_period
              - '1991'
              - '2020'            
            other_search_criteria:
                source:
                    "CaSR"
                version: "v32"
        extract_dataset:
            mask: True

biasadjust:
    variables:
        dtr: &generic-ba
            training_args:
                period: *ref_period
            # adjusting_args:
            #     bias_adjust_reference: #FIXME: put when xscen>=0.13.1
            #       CaSRv32 # TODO: put right version
        tasmax: *generic-ba
        pr: *generic-ba
        # hurs: *generic-ba #TODO: put back if not ESPO-R
        # hursTasmax: *generic-ba

bias_adjust_reference: #in the mean time
  CaSRv32


clean_up:
  xscen_clean_up:
      maybe_unstack_dict:
        rechunk:
          rlat: 20
          rlon: 20
          time: -1
      attrs_to_remove:
        rlat: original_shape
        rlon: original_shape
      add_attrs:
        global:
          Notes: |
            Regridded on the grid of CaSR v3.2, then bias-adjusted with detrended
            quantile mapping on a day-of-year basis with a window of 31 days, LOESS
            detrending and 50 quantiles. The reference was CaSR v3.2 over the
            1991-2020 period. Tasmax, hurs, hursTasmax, dtr and pr were adjusted, tasmin was computed
            from tasmax and dtr after the adjustment.
        rlat:
          axis: Y
        rlon:
          axis: X

diagnostics:
  properties_and_measures:
    period: *ref_period

health_checks:
  final:
    structure:
      coords:
        - rlat
        - rlon
        - time
        - lat 
        - lon
        - rotated_pole
      dims:
        - rlat
        - rlon
        - time
    

chunks:
  working:
    rlat: 20
    rlon: 20
    loc: 600
    time: -1
  diag:
    rlat: -1
    rlon: -1
  final: 
    rlat: 50
    rlon: 50
    time: 4year