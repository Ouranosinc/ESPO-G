#config_NAM-R2

custom:
    full_region:
      name: NAM-R2
      method: bbox
      lon_bnds: [-179.95, -10  ]
      lat_bnds: [ 10, 83.4 ]



subregions:
  n: 7500 # number of loc in one region
  num_of_regions: 75 #TODO: check # can be calculated if we don't know it

extraction:
    reference:
        search_data_catalogs:
            other_search_criteria:
                source: &ref_source
                  RDRS
            periods : &ref_period
                  - '1989'
                  - '2018'

biasadjust_mbcn:
  train:
    period: *ref_period

clean_up:
  xscen_clean_up:
    add_attrs:
      global:
        Notes: |
          Regridded on the grid of RDRS, then bias-adjusted with MBCn.
          The reference was RDRS over the 1989-2018 period.
 
diagnostics:
  properties_and_measures:
    period: *ref_period
  health_checks:
    structure:
      coords: #TODO: put in region specific config
        - lat
        - lon
        - rlat
        - rlon
        - rotated_pole
        - time
      dims:
        - rlat
        - rlon
        - time
  

chunks:
  working:
      rlat: 15
      rlon: 15
      loc: 10
      time: -1
  final: 
      rlat: 30
      rlon: 30
      time: 4year