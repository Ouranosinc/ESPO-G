doc: |
  ====================================
  Indicators for Post-2100 Analysis
  ====================================
indicators:
  dry_days_annual:
    base: dry_days
    cf_attrs:
      var_name: dry_days
    parameters:
      freq: YS

  dry_days_seasonal:
    base: dry_days
    cf_attrs:
      var_name: dry_days
    parameters:
      freq: QS-DEC

  maximum_consecutive_dry_days_annual:
    base: cdd
    cf_attrs:
      var_name: maximum_consecutive_dry_days
    parameters:
      freq: YS

  maximum_consecutive_dry_days_seasonal:
    base: cdd
    cf_attrs:
      var_name: maximum_consecutive_dry_days
    parameters:
      freq: QS-DEC

  rx1day_annual:
    base: rx1day
    cf_attrs:
      var_name: rx1day
    parameters:
      freq: YS

  rx1day_seasonal:
    base: rx1day
    cf_attrs:
      var_name: rx1day
    parameters:
      freq: QS-DEC

  max_n_day_precipitation_amount_n_5_annual:
    base: max_n_day_precipitation_amount
    cf_attrs:
      var_name: rx5day
    parameters:
      window: 5
      freq: YS
    keywords: rolling

  prcpavg_annual:
    base: prcpavg
    cf_attrs:
      var_name: prcpavg
    parameters:
      freq: YS
    
  prcpavg_seasonal: 
    base: prcpavg
    cf_attrs:
      var_name: prcpavg
    parameters:
      freq: QS-DEC

  prcptot_annual:          # 15 min
    base: prcptot
    cf_attrs:
      var_name: prcptot
    parameters:
      freq: YS

  prcptot_seasonal:        # 40 min
    base: prcptot
    cf_attrs:
      var_name: prcptot
    parameters:
      freq: QS-DEC

  tg_mean_annual:          # 20 min
    base: tg_mean
    cf_attrs:
      var_name: tg_mean
    parameters:
      freq: YS

  tg_mean_seasonal:        # 1 h
    base: tg_mean
    cf_attrs:
      var_name: tg_mean
    parameters:
      freq: QS-DEC

  tx_mean_annual:          # 20 min
    base: tx_mean
    cf_attrs:
      var_name: tx_mean
    parameters:
      freq: YS

  tx_mean_seasonal:        # 40 min
    base: tx_mean
    cf_attrs:
      var_name: tx_mean
    parameters:
      freq: QS-DEC

  tn_mean_annual:          # 20 min
    base: tn_mean
    cf_attrs:
      var_name: tn_mean
    parameters:
      freq: YS

  tn_mean_seasonal:        # 30 min
    base: tn_mean
    cf_attrs:
      var_name: tn_mean
    parameters:
      freq: QS-DEC

  tn_days_above_0_seasonal:
    base: tn_days_above
    cf_attrs:
      var_name: tn_days_above_0
    parameters:
      thresh: 0 degC
      freq: QS-DEC

  tn_min: # for plat_comp
    base: tn_min
    cf_attrs:
      var_name: tn_min
    parameters:
      freq: QS-DEC